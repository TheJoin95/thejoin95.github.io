    <text x="48" y="111" font-size="22" fill="#b7c7d4">Source-derived architecture overview · archived 2020 project</text>
  </g>
  <g fill="none" stroke="#8eafc8" stroke-width="2">
    <rect x="48" y="176" width="320" height="152"/>
    <rect x="440" y="176" width="320" height="152"/>
    <rect x="832" y="176" width="320" height="152"/>
    <path d="M368 252h72m-14-10 14 10-14 10M760 252h72m-14-10 14 10-14 10"/>
  </g>
  <g fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="208" y="232" font-size="32">Frontend</text>
    <text x="208" y="281" font-size="26" fill="#b7c7d4">GitHub Pages</text>
    <text x="600" y="232" font-size="32">Backend</text>
    <text x="600" y="281" font-size="26" fill="#b7c7d4">Flask + uWSGI</text>
    <text x="992" y="232" font-size="32">Redis</text>
