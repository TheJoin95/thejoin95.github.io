<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Supermarket waiting times — documented architecture</title>
  <desc id="desc">A source-derived diagram, not a historical screenshot. A GitHub Pages frontend connects to a Flask and uWSGI backend using Redis for geospatial lookup and expiring cached data. Hosting evolved from a Raspberry Pi to VPS instances in Europe and America.</desc>
