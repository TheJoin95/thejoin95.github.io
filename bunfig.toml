[run]
# Run CLI shebangs with Bun, including ESLint, TypeScript, and Next.js.
bun = true
shell = "bun"

[install]
exact = true
saveTextLockfile = true

[test]
root = "tests"
preload = ["./tests/setup.ts"]
coverageSkipTestFiles = true
# Stateful gallery interaction is exercised in Playwright, not the Bun unit suite.
coveragePathIgnorePatterns = ["tests/**", "src/components/gallery/media-gallery.tsx"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 0.85, functions = 0.85 }
